<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to TickTick...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 { margin-bottom: 0.5rem; }
    p { opacity: 0.9; }
    a { color: white; }
  </style>
  <script>
    // Get the path from hash (e.g., #p/xxx/tasks/yyy)
    const path = window.location.hash;
    if (path) {
      const ticktickUrl = "ticktick:///webapp/" + path;
      window.location.href = ticktickUrl;
    }
  </script>
</head>
<body>
  <div class="container">
    <h1>📋 TickTick Redirect</h1>
    <p>Opening in TickTick desktop app...</p>
    <p><small>If nothing happens, <a href="#" id="manual-link">click here</a></small></p>
  </div>
  <script>
    const path = window.location.hash;
    if (path) {
      document.getElementById('manual-link').href = "ticktick:///webapp/" + path;
    }
  </script>
</body>
</html>
