<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to TickTick...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container { text-align: center; padding: 2rem; }
    h1 { margin-bottom: 0.5rem; }
    p { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 TickTick</h1>
    <p>Opening task... Returning to Calendar shortly.</p>
  </div>
  <a id="ticktick-link" style="display:none;"></a>
  <script>
    const path = window.location.hash;
    if (path) {
      // Create and click a hidden link to open TickTick (doesn't navigate away)
      const link = document.getElementById('ticktick-link');
      link.href = "ticktick:///webapp/" + path;
      link.click();
      
      // After 2 seconds, redirect to Google Calendar
      setTimeout(function() {
        window.location.href = "https://calendar.google.com";
      }, 1000);
    }
  </script>
</body>
</html>
